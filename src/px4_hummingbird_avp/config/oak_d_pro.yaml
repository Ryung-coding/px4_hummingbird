/oak:
  ros__parameters:
    driver:
      i_device_id: '19443010D193985A00'
      i_usb_port_id: ''
      i_usb_speed: SUPER
    pipeline_gen:
      i_pipeline_type: RGBD
      i_nn_type: none
    rgb:
      i_publish_topic: true
      i_fps: 10.0
      i_width: 640
      i_height: 360
      i_low_bandwidth: true
    stereo:
      i_fps: 10.0
      i_depth_preset: DEFAULT
      i_aligned: false

/avp_oak:
  ros__parameters:
    physical_usb_port: '3-7'
    # ROS base_link is FLU. OAK model +Z points forward, model +Y points up.
    # The driver separately rotates into the optical frame (+Z forward, +Y down).
    parent_frame: base_link
    position_m:
      x: 0.20
      y: 0.0
      z: 0.0
    rpy_rad:
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
    color_image_topic: /oak/rgb/image_raw
    depth_image_topic: /oak/stereo/image_raw
    video_fps: 10.0
    camera_info_topic: /oak/stereo/camera_info
    sample_step: 2
    max_depth_m: 6.0
