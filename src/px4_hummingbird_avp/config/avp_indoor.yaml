# AVP Planner / map(ENU) 기준. 나무는 X=+1, 비행 경로는 X=0에서 Y=+1 -> -1.
avp_planner:
  ros__parameters:
    # [A] 나무 관측 영역(ROI). 기체 비행 가능 영역과는 별개.
    roi_x_min: 0.2              # 나무 영역 X 하한 [m]
    roi_x_max: 1.8              # 나무 영역 X 상한 [m]
    roi_y_min: -1.8             # 나무 영역 Y 하한 [m]
    roi_y_max: 1.8              # 나무 영역 Y 상한 [m]
    roi_z_min: 0.2              # 나무 영역 높이 하한 [m]
    roi_z_max: 2.5              # 나무 영역 높이 상한 [m]

    # [B] 지도 해상도, 관측 거리 및 시점 생성.
    resolution: 0.05            # 지도 복셀 크기 [m]; Executor occ_resolution과 일치
    plan_res: 0.15              # 경로 탐색 해상도 [m]
    inflate_m: 0.5              # 경로 탐색 시 장애물 팽창 거리 [m]
    visit_radius: 0.25          # 관측 시점 도달 판정 반경 [m]
    d_opt: 0.9                  # 표면 관측 목표 거리 [m]
    d_min: 0.6                  # 관측 거리 하한 [m]
    d_max: 1.5                  # 관측 거리 상한 [m]
    max_range: 3.5              # 입력 점군 최대 사용 거리 [m]
    pixel_stride: 4             # 입력 점군에서 4개 중 1개 사용
    max_pitch_deg: 30.0         # 관측 시점의 Pitch 절댓값 제한 [deg]
    vp_safety_margin: 0.75      # 시점의 장애물 안전 여유 [m]; Executor 0.5 m보다 큼

    # [C] 스윕 높이, 자세 우선 시점 생성 및 SQC 후보 평가.
    w_dist: 1.0                 # 관측 거리 가중치
    sweep_z_levels: [1.0]       # 시점 후보 높이 [m]; 실행기의 중복 왕복은 별도
    vp_pitch_target_deg: 18.0   # 위치보다 카메라 Pitch 변경을 우선하는 목표 각도 [deg]
    vp_height_offset_m: 0.0     # 스윕 높이에서 시점이 벗어날 수 있는 최대 거리 [m]
    w_angle: 1.0                # 관측 각도 가중치
    w_base: 1.0                 # 관측 방향 다양성 가중치
    w_frontier: 20.0            # 미관측 경계 가중치
    sqc_min: 0.8                # 시점 후보 점수 하한
    min_cluster: 4              # 표면 패치의 최소 복셀 수
    top_k: 12                   # 한 번에 전달할 시점 후보 수
    plan_period_s: 10.0         # 재계획 주기 [s]

    # [D] 시점 생성 허용 영역. 아래 Executor 비행 경계와 일치시킬 것.
    corridor_x_min: -0.75       # X 하한 [m]
    corridor_x_max: 0.75        # X 상한 [m]
    corridor_y_min: -1.6        # Y 하한 [m]
    corridor_y_max: 2.1         # Y 상한 [m]
    corridor_z_min: 0.45        # 높이 하한 [m]
    corridor_z_max: 2.1         # 높이 상한 [m]

# Corridor Executor / map(ENU) 기준.
corridor_executor:
  ros__parameters:
    # [A] 비행 코리더. +X 방향에 나무가 있으며 Planner corridor_*와 일치.
    x_min: -0.75                # 기체 중심 X 하한 [m]
    x_max: 0.75                 # 기체 중심 X 상한 [m]
    y_min: -1.6                 # Y 하한 [m]; -Y 스윕 끝보다 0.6 m 여유
    y_max: 2.1                  # Y 상한 [m]; +Y 스윕 시작보다 1.1 m 여유
    z_min: 0.45                 # 비행 높이 하한 [m]
    z_max: 2.1                  # 비행 높이 상한 [m]

    # [B] 기본 스윕과 관측 시점 방문.
    sweep_y_min: -1.0           # 스윕 Y 하한 [m]; 첫 구간은 +Y에서 시작
    sweep_y_max: 1.0            # 스윕 Y 상한 [m]
    z_levels: [1.0, 1.0, 1.0, 1.0] # Y 방향을 번갈아 이동하며 두 번 왕복 [m]
    cruise_speed: 0.3           # 위치 목표 순항 속도 [m/s]
    accel: 0.3                  # 궤적 가감속 크기 [m/s^2]
    level_hold_s: 2.0           # 높이 변경 후 정지 시간 [s]
    dwell_s: 2.0                # 선택된 관측 시점의 정지 시간 [s]
    wait_vp_s: 3.0              # 시점 미수신 시 기본 스윕 시작까지 대기 [s]
    use_vp_pitch: true          # 시점 Pitch로 보간하여 이동
    pitch_rate_deg_s: 20.0      # Pitch 목표 변화율 제한 [deg/s]
    vp_merge_m: 0.25            # 가까운 시점 중복 방문 방지 거리 [m]
    vp_level_tol_m: 0.3         # 현재 스윕 높이와 시점 높이의 허용 차이 [m]

    # [C] 장애물 대응과 실제 위치 추종 판정.
    occ_resolution: 0.05        # 장애물 지도 해상도 [m]; Planner resolution과 일치
    clear_m: 0.5                # 목표 주변 장애물 이격 거리 [m]
    arrival_tol_m: 0.1          # 실제 위치의 도착 판정 오차 [m]; 시점에 도착한 뒤 다음 목표로 이동
    tracking_tol_m: 0.5         # 실제 위치가 뒤처지면 목표 진행을 멈추는 오차 [m]

    # [D] PX4 명령 연결.
    setpoint_topic: /avp/setpoint # Executor가 발행하는 위치·자세 목표 토픽
    require_control: true       # DDS/Offboard와 초기 위치가 준비될 때까지 진행 정지
