#####
#
# HummingBird uXRCE-DDS topic map.
# Keep only topics used by px4_hummingbird ROS2 nodes.
#
#####
publications:
  - topic: /fmu/out/actuator_servos
    type: px4_msgs::msg::ActuatorServos

  - topic: /fmu/out/actuator_motors
    type: px4_msgs::msg::ActuatorMotors

  - topic: /fmu/out/hummingbird_status
    type: px4_msgs::msg::HummingbirdStatus

  - topic: /fmu/out/manual_control_setpoint
    type: px4_msgs::msg::ManualControlSetpoint

  - topic: /fmu/out/vehicle_local_position
    type: px4_msgs::msg::VehicleLocalPosition

  - topic: /fmu/out/vehicle_local_position_setpoint
    type: px4_msgs::msg::VehicleLocalPositionSetpoint

  - topic: /fmu/out/vehicle_attitude
    type: px4_msgs::msg::VehicleAttitude

  - topic: /fmu/out/vehicle_attitude_setpoint
    type: px4_msgs::msg::VehicleAttitudeSetpoint

  - topic: /fmu/out/vehicle_thrust_setpoint
    type: px4_msgs::msg::VehicleThrustSetpoint

  - topic: /fmu/out/vehicle_torque_setpoint
    type: px4_msgs::msg::VehicleTorqueSetpoint

  - topic: /fmu/out/vehicle_status
    type: px4_msgs::msg::VehicleStatus

subscriptions:
  - topic: /fmu/in/offboard_control_mode
    type: px4_msgs::msg::OffboardControlMode

  - topic: /fmu/in/trajectory_setpoint6dof
    type: px4_msgs::msg::TrajectorySetpoint6dof

  - topic: /fmu/in/vehicle_command
    type: px4_msgs::msg::VehicleCommand
