vrpn_client:
  server: "192.168.6.28"
  port: 3883
  frame_id: "Hummingbird"
  update_freq: 1000.0
  refresh_freq: 1.0
  multi_sensor: false
  use_vrpn_timestamps: false
  sensor_data_qos: true

mocap_to_px4:
  input_topic: "/nokov_raw/Hummingbird/pose"
  mocap_topic: "/opti_raw"
  output_topic: "/fmu/in/vehicle_visual_odometry"
  target_body_name: "Hummingbird"
  position_scale: 0.001
  opti_origin: [-0.08, -0.524, 0.016] #z-up기준 HB가 있는 위치를 기입
  position_stddev: 0.02
  orientation_stddev_deg: 3.0
  quality: 100
  qos_depth: 10

viewer:
  opti_topic: "/opti_raw"
  fmu_odom_topic: "/fmu/out/vehicle_odometry"
  target_body_name: "Hummingbird"
  opti_origin: [-0.08, -0.524, 0.016] #z-up기준 HB가 있는 위치를 기입
  opti_delay_avg_sec: 3.0
  opti_rate_window_sec: 3.0
  opti_lost_hz_threshold: 50.0
